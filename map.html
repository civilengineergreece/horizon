<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horizon · 3D χάρτης ταξιδιού</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#06131d;color:#eef6fb}*{box-sizing:border-box}body{margin:0;background:#06131d}#map{position:fixed;inset:0}.hz-top{position:fixed;z-index:5;left:14px;right:14px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}.hz-card{pointer-events:auto;max-width:min(720px,calc(100vw - 110px));padding:11px 14px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(5,20,31,.88);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.25)}.hz-brand{font-weight:950;letter-spacing:.08em;color:#ff7a16}.hz-title{font-weight:850;margin-top:2px}.hz-sub{font-size:.76rem;color:#a9bac6;margin-top:3px}.hz-toggle{pointer-events:auto;margin-left:auto;border:1px solid rgba(255,255,255,.18);background:#0b2536;color:#fff;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.hz-status{position:fixed;z-index:5;left:14px;bottom:18px;max-width:min(680px,calc(100vw - 28px));padding:9px 12px;border-radius:12px;background:rgba(5,20,31,.86);color:#b7c7d2;font-size:.74rem;border:1px solid rgba(255,255,255,.11)}.hz-marker{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ff7a16;color:#08131b;font-weight:950;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}.hz-marker-label{position:absolute;left:35px;top:50%;transform:translateY(-50%);min-width:max-content;max-width:260px;padding:6px 9px;border-radius:9px;background:rgba(5,20,31,.92);border:1px solid rgba(255,255,255,.17);color:#fff;font-size:.72rem;font-weight:850;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}.hz-legend{position:fixed;z-index:5;left:14px;bottom:62px;width:min(360px,calc(100vw - 28px));max-height:34vh;overflow:auto;padding:8px;border-radius:13px;background:rgba(5,20,31,.88);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);display:none}.hz-legend.show{display:block}.hz-legend-title{padding:3px 5px 7px;color:#a9bac6;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.hz-legend-item{display:flex;gap:8px;align-items:center;width:100%;padding:7px;border:0;border-radius:9px;background:transparent;color:#eef6fb;text-align:left;cursor:pointer}.hz-legend-item:hover{background:rgba(255,255,255,.07)}.hz-legend-num{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ff7a16;color:#08131b;font-size:.72rem;font-weight:950}.hz-legend-name{font-size:.72rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:600px){.hz-card{max-width:calc(100vw - 92px)}.hz-sub{display:none}.hz-toggle{padding:9px 10px}.hz-marker-label{left:32px;max-width:145px;font-size:.62rem;padding:5px 7px}.hz-legend{width:min(310px,calc(100vw - 28px));max-height:26vh}.hz-status{font-size:.66rem}}
</style>
</head>
<body>
<div id="map"></div>
<div class="hz-top"><div class="hz-card"><div class="hz-brand">HORIZON</div><div class="hz-title" id="title">3D χάρτης ταξιδιού</div><div class="hz-sub">OpenStreetMap / OpenFreeMap · κάθε αριθμός δείχνει τη στάση του προγράμματος</div></div><button class="hz-toggle" id="toggle">2D / 3D</button></div>
<div class="hz-legend" id="legend"><div class="hz-legend-title">Στάσεις διαδρομής</div><div id="legendItems"></div></div>
<div class="hz-status" id="status">Προετοιμασία χάρτη…</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
(()=>{
'use strict';
const p=new URLSearchParams(location.search),destination=(p.get('d')||'').trim(),raw=(p.get('stops')||'').split('|').map(x=>x.trim()).filter(Boolean).slice(0,10);
const title=document.getElementById('title'),status=document.getElementById('status'),legend=document.getElementById('legend'),legendItems=document.getElementById('legendItems');
title.textContent=destination?`${destination} · 3D χάρτης`:'Horizon · 3D χάρτης';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[23.7275,37.9838],zoom:11,pitch:55,bearing:-12,antialias:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
let is3d=true;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function geocode(query,label){
  const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','jsonv2');u.searchParams.set('limit','1');u.searchParams.set('accept-language','el,en');u.searchParams.set('q',query);
  const r=await fetch(u.toString(),{headers:{accept:'application/json'}});if(!r.ok)throw new Error(`geocode ${r.status}`);const a=await r.json();if(!a?.[0])return null;return {lng:Number(a[0].lon),lat:Number(a[0].lat),label:label||query};
}
function add3dBuildings(){
  if(map.getLayer('hz-3d-buildings'))return;
  try{
    const sources=map.getStyle()?.sources||{};const vectorId=Object.keys(sources).find(k=>sources[k]?.type==='vector');if(!vectorId)return;
    map.addLayer({id:'hz-3d-buildings',type:'fill-extrusion',source:vectorId,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#9aaab5','fill-extrusion-height':['to-number',['coalesce',['get','render_height'],['get','height'],6]],'fill-extrusion-base':['to-number',['coalesce',['get','render_min_height'],0]],'fill-extrusion-opacity':.68}});
  }catch(e){console.debug('3D buildings unavailable',e);}
}
function buildLegend(points){
  legendItems.innerHTML='';points.forEach((pt,i)=>{const b=document.createElement('button');b.type='button';b.className='hz-legend-item';b.innerHTML=`<span class="hz-legend-num">${i+1}</span><span class="hz-legend-name"></span>`;b.querySelector('.hz-legend-name').textContent=pt.label;b.title=pt.label;b.addEventListener('click',()=>map.flyTo({center:[pt.lng,pt.lat],zoom:16,pitch:is3d?58:0,bearing:is3d?-10:0,duration:750}));legendItems.appendChild(b);});legend.classList.toggle('show',points.length>0);
}
function draw(points){
  points.forEach((pt,i)=>{const el=document.createElement('div');el.className='hz-marker';el.textContent=String(i+1);const label=document.createElement('span');label.className='hz-marker-label';label.textContent=pt.label;el.appendChild(label);new maplibregl.Marker({element:el}).setLngLat([pt.lng,pt.lat]).setPopup(new maplibregl.Popup({offset:22}).setHTML(`<strong>${i+1}. ${pt.label.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</strong>`)).addTo(map);});
  buildLegend(points);
  if(points.length>1){map.addSource('hz-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:points.map(x=>[x.lng,x.lat])}}});map.addLayer({id:'hz-route',type:'line',source:'hz-route',paint:{'line-color':'#ff7a16','line-width':4,'line-opacity':.88}});}
  if(points.length){const b=new maplibregl.LngLatBounds();points.forEach(x=>b.extend([x.lng,x.lat]));map.fitBounds(b,{padding:{top:100,bottom:120,left:100,right:180},maxZoom:15,duration:900});setTimeout(()=>map.easeTo({pitch:is3d?58:0,bearing:is3d?-10:0,duration:700}),950);}
}
map.on('load',async()=>{
  add3dBuildings();
  const labels=raw.length?raw:[destination].filter(Boolean),queries=raw.length?raw.map(x=>`${x}, ${destination}`):labels;const points=[];
  for(let i=0;i<queries.length;i++){
    status.textContent=`Εντοπισμός σημείων ${i+1}/${queries.length}…`;
    try{const pt=await geocode(queries[i],labels[i]);if(pt)points.push(pt);}catch(e){console.debug(e);}if(i<queries.length-1)await sleep(1050);
  }
  if(!points.length&&destination){try{const pt=await geocode(destination,destination);if(pt)points.push(pt);}catch(e){}}
  draw(points);status.textContent=points.length?`Βρέθηκαν ${points.length} στάσεις. Τα ονόματα φαίνονται δίπλα στους αριθμούς και στη λίστα κάτω αριστερά.`:'Δεν εντοπίστηκαν αυτόματα σημεία. Ο χάρτης παραμένει διαθέσιμος για εξερεύνηση.';
});
document.getElementById('toggle').addEventListener('click',()=>{is3d=!is3d;map.easeTo({pitch:is3d?58:0,bearing:is3d?-10:0,duration:650});const l=map.getLayer('hz-3d-buildings');if(l)map.setLayoutProperty('hz-3d-buildings','visibility',is3d?'visible':'none');});
})();
</script>
</body>
</html>
