<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horizon · 3D χάρτης ταξιδιού</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#06131d;color:#eef6fb}*{box-sizing:border-box}body{margin:0;background:#06131d}#map{position:fixed;inset:0}.hz-top{position:fixed;z-index:5;left:14px;right:14px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}.hz-card{pointer-events:auto;max-width:min(760px,calc(100vw - 150px));padding:11px 14px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(5,20,31,.90);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.25)}.hz-brand{font-weight:950;letter-spacing:.08em;color:#ff7a16}.hz-title{font-weight:850;margin-top:2px}.hz-sub{font-size:.76rem;color:#a9bac6;margin-top:3px}.hz-toggle{pointer-events:auto;margin-left:auto;border:1px solid rgba(255,255,255,.18);background:#0b2536;color:#fff;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.hz-status{position:fixed;z-index:5;left:14px;bottom:18px;max-width:min(760px,calc(100vw - 28px));padding:9px 12px;border-radius:12px;background:rgba(5,20,31,.90);color:#d5e3ec;font-size:.74rem;border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(10px)}.hz-stop-marker{display:flex;align-items:center;gap:7px;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}.hz-stop-num{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:#ff7a16;color:#07131b;font-weight:950;border:2px solid #fff}.hz-stop-name{max-width:270px;padding:6px 9px;border-radius:9px;background:rgba(5,20,31,.94);border:1px solid rgba(255,255,255,.20);color:#fff;font-size:.73rem;font-weight:900;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hz-legend{position:fixed;z-index:5;left:14px;bottom:62px;width:min(390px,calc(100vw - 28px));max-height:34vh;overflow:auto;padding:8px;border-radius:13px;background:rgba(5,20,31,.91);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);display:none}.hz-legend.show{display:block}.hz-legend-title{padding:3px 5px 7px;color:#a9bac6;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.hz-legend-item{display:flex;gap:8px;align-items:center;width:100%;padding:7px;border:0;border-radius:9px;background:transparent;color:#eef6fb;text-align:left;cursor:pointer}.hz-legend-item:hover{background:rgba(255,255,255,.07)}.hz-legend-num{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ff7a16;color:#08131b;font-size:.72rem;font-weight:950}.hz-legend-name{font-size:.72rem;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hz-info{position:fixed;z-index:7;right:14px;top:82px;width:min(400px,calc(100vw - 28px));max-height:calc(100vh - 112px);overflow:auto;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(5,20,31,.96);color:#eef6fb;box-shadow:0 16px 44px rgba(0,0,0,.4);backdrop-filter:blur(14px);display:none}.hz-info.show{display:block}.hz-info-head{display:flex;gap:10px;align-items:flex-start;padding:15px 15px 11px;border-bottom:1px solid rgba(255,255,255,.09)}.hz-info-num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:#ff7a16;color:#07131b;font-weight:950;border:2px solid #fff}.hz-info-title{font-size:1rem;font-weight:950;line-height:1.25}.hz-info-meta{margin-top:4px;color:#94a9b7;font-size:.7rem;line-height:1.35}.hz-info-close{margin-left:auto;border:0;background:transparent;color:#dce7ed;font-size:22px;line-height:1;cursor:pointer;padding:0 2px}.hz-info-body{padding:13px 15px 15px}.hz-info-label{margin-top:10px;color:#ff9a49;font-size:.64rem;font-weight:950;text-transform:uppercase;letter-spacing:.05em}.hz-info-text{margin-top:5px;color:#e6eff4;font-size:.79rem;line-height:1.55}.hz-info-address{color:#b9cad4}.hz-info-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.hz-info-btn{border:1px solid rgba(255,255,255,.15);background:#0b2536;color:#eef6fb;border-radius:10px;padding:8px 10px;font-size:.72rem;font-weight:900;cursor:pointer;text-decoration:none}.hz-info-btn.primary{border-color:rgba(255,122,22,.55);background:#ff7a16;color:#07131b}.hz-info-source{margin-top:12px;color:#718896;font-size:.62rem;line-height:1.4}.hz-info-loading{color:#9fb0bd;font-style:italic}.hz-info-empty{color:#9fb0bd}.hz-wiki-link{display:none}.hz-wiki-link.show{display:inline-flex}@media(max-width:650px){.hz-card{max-width:calc(100vw - 100px)}.hz-sub{display:none}.hz-toggle{padding:9px 10px}.hz-stop-name{max-width:150px;font-size:.62rem;padding:5px 7px}.hz-legend{width:min(330px,calc(100vw - 28px));max-height:23vh}.hz-status{font-size:.66rem}.hz-info{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:56vh}.hz-status{bottom:12px;max-width:calc(100vw - 24px)}.hz-info.show~.hz-status{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="hz-top"><div class="hz-card"><div class="hz-brand">HORIZON</div><div class="hz-title" id="title">3D χάρτης ταξιδιού</div><div class="hz-sub">Πραγματική οδική διαδρομή · πάτησε σε μια στάση για πληροφορίες</div></div><button class="hz-toggle" id="toggle">2D / 3D</button></div>
<div class="hz-legend" id="legend"><div class="hz-legend-title">Στάσεις διαδρομής</div><div id="legendItems"></div></div>
<aside class="hz-info" id="infoPanel" aria-live="polite">
  <div class="hz-info-head"><div class="hz-info-num" id="infoNum">1</div><div><div class="hz-info-title" id="infoTitle">Στάση</div><div class="hz-info-meta" id="infoMeta"></div></div><button class="hz-info-close" id="infoClose" type="button" aria-label="Κλείσιμο">×</button></div>
  <div class="hz-info-body">
    <div class="hz-info-label">Τοποθεσία</div><div class="hz-info-text hz-info-address" id="infoAddress">—</div>
    <div class="hz-info-label">Πληροφορίες</div><div class="hz-info-text hz-info-loading" id="infoSummary">Αναζήτηση πληροφοριών…</div>
    <div class="hz-info-actions"><button class="hz-info-btn primary" id="infoFocus" type="button">◎ Εστίαση</button><a class="hz-info-btn hz-wiki-link" id="infoWiki" target="_blank" rel="noopener">Wikipedia</a></div>
    <div class="hz-info-source" id="infoSource">Τοποθεσία: OpenStreetMap · περιγραφή όπου υπάρχει: Wikipedia.</div>
  </div>
</aside>
<div class="hz-status" id="status">Προετοιμασία χάρτη…</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
(()=>{
'use strict';
const p=new URLSearchParams(location.search),destination=(p.get('d')||'').trim(),raw=(p.get('stops')||'').split('|').map(x=>x.trim()).filter(Boolean).slice(0,10);
const title=document.getElementById('title'),status=document.getElementById('status'),legend=document.getElementById('legend'),legendItems=document.getElementById('legendItems');
const infoPanel=document.getElementById('infoPanel'),infoNum=document.getElementById('infoNum'),infoTitle=document.getElementById('infoTitle'),infoMeta=document.getElementById('infoMeta'),infoAddress=document.getElementById('infoAddress'),infoSummary=document.getElementById('infoSummary'),infoWiki=document.getElementById('infoWiki'),infoFocus=document.getElementById('infoFocus');
title.textContent=destination?`${destination} · 3D χάρτης`:'Horizon · 3D χάρτης';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[23.7275,37.9838],zoom:11,pitch:55,bearing:-12,antialias:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
let is3d=true,selectedStop=null,infoRequest=0;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function cleanText(v,max=1000){return String(v||'').replace(/\s+/g,' ').trim().slice(0,max);}
function typeLabel(pt){const raw=cleanText([pt.category,pt.type].filter(Boolean).join(' · '),90);return raw||'σημείο ενδιαφέροντος';}
function addressLabel(a,display){if(!a)return cleanText(display,220)||'Δεν υπάρχει διαθέσιμη διεύθυνση.';const vals=[a.road,a.pedestrian,a.neighbourhood,a.suburb,a.city||a.town||a.village,a.municipality,a.state].filter(Boolean);return cleanText([...new Set(vals)].join(', '),240)||cleanText(display,220)||'Δεν υπάρχει διαθέσιμη διεύθυνση.';}
async function geocode(query,label){
  const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','jsonv2');u.searchParams.set('limit','1');u.searchParams.set('accept-language','el,en');u.searchParams.set('addressdetails','1');u.searchParams.set('extratags','1');u.searchParams.set('namedetails','1');u.searchParams.set('q',query);
  const r=await fetch(u.toString(),{headers:{accept:'application/json'}});if(!r.ok)throw new Error(`geocode ${r.status}`);const a=await r.json();if(!a?.[0])return null;const x=a[0];return {lng:Number(x.lon),lat:Number(x.lat),label:String(label||query).trim()||'Στάση',displayName:x.display_name||'',category:x.category||x.class||'',type:x.type||'',address:x.address||null,extra:x.extratags||{},osmType:x.osm_type||'',osmId:x.osm_id||null};
}
async function roadRoute(points){
  if(points.length<2)return {coords:points.map(x=>[x.lng,x.lat]),distance:null,duration:null,routed:false};
  const coords=points.map(x=>`${x.lng},${x.lat}`).join(';');
  const endpoints=[`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false&alternatives=false`,`https://routing.openstreetmap.de/routed-car/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false&alternatives=false`];
  for(const url of endpoints){try{const r=await fetch(url,{headers:{accept:'application/json'}});if(!r.ok)continue;const j=await r.json();const route=j?.routes?.[0];if(route?.geometry?.coordinates?.length>1)return {coords:route.geometry.coordinates,distance:Number(route.distance)||null,duration:Number(route.duration)||null,routed:true};}catch(e){console.debug('Road router unavailable',e);}}
  return {coords:points.map(x=>[x.lng,x.lat]),distance:null,duration:null,routed:false};
}
async function wikiLookup(label){
  const searches=[`${label} ${destination}`.trim(),label].filter(Boolean);let last=null;
  for(const q of searches){
    try{
      const u=new URL('https://el.wikipedia.org/w/api.php');u.searchParams.set('origin','*');u.searchParams.set('action','query');u.searchParams.set('format','json');u.searchParams.set('formatversion','2');u.searchParams.set('generator','search');u.searchParams.set('gsrsearch',q);u.searchParams.set('gsrlimit','1');u.searchParams.set('prop','extracts|info');u.searchParams.set('exintro','1');u.searchParams.set('explaintext','1');u.searchParams.set('inprop','url');u.searchParams.set('redirects','1');
      const r=await fetch(u.toString(),{headers:{accept:'application/json'}});if(!r.ok)continue;const j=await r.json();const page=j?.query?.pages?.[0];if(page){last=page;if(cleanText(page.extract,80))break;}
    }catch(e){console.debug('Wikipedia lookup unavailable',e);}
  }
  if(!last)return null;return {title:cleanText(last.title,140),extract:cleanText(last.extract,900),url:last.fullurl||''};
}
function add3dBuildings(){if(map.getLayer('hz-3d-buildings'))return;try{const sources=map.getStyle()?.sources||{};const vectorId=Object.keys(sources).find(k=>sources[k]?.type==='vector');if(!vectorId)return;map.addLayer({id:'hz-3d-buildings',type:'fill-extrusion',source:vectorId,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#9aaab5','fill-extrusion-height':['to-number',['coalesce',['get','render_height'],['get','height'],6]],'fill-extrusion-base':['to-number',['coalesce',['get','render_min_height'],0]],'fill-extrusion-opacity':.68}});}catch(e){console.debug('3D buildings unavailable',e);}}
async function openStop(pt,i){
  selectedStop=pt;const req=++infoRequest;infoPanel.classList.add('show');infoNum.textContent=String(i+1);infoTitle.textContent=pt.label||`Στάση ${i+1}`;infoMeta.textContent=`${destination||'Horizon'} · ${typeLabel(pt)}`;infoAddress.textContent=addressLabel(pt.address,pt.displayName);infoSummary.textContent='Αναζήτηση πληροφοριών…';infoSummary.className='hz-info-text hz-info-loading';infoWiki.classList.remove('show');infoWiki.removeAttribute('href');
  map.flyTo({center:[pt.lng,pt.lat],zoom:16,pitch:is3d?58:0,bearing:is3d?-10:0,duration:650});
  const wiki=await wikiLookup(pt.label||'');if(req!==infoRequest)return;
  if(wiki?.extract){infoSummary.textContent=wiki.extract;infoSummary.className='hz-info-text';if(wiki.url){infoWiki.href=wiki.url;infoWiki.classList.add('show');}}
  else{const hint=pt.extra?.description||pt.extra?.inscription||'';infoSummary.textContent=cleanText(hint,700)||'Δεν βρέθηκε διαθέσιμη εγκυκλοπαιδική περιγραφή για αυτή τη στάση. Η θέση και η διαδρομή προέρχονται από το OpenStreetMap.';infoSummary.className='hz-info-text hz-info-empty';}
}
function buildLegend(points){legendItems.innerHTML='';points.forEach((pt,i)=>{const b=document.createElement('button');b.type='button';b.className='hz-legend-item';b.innerHTML=`<span class="hz-legend-num">${i+1}</span><span class="hz-legend-name"></span>`;b.querySelector('.hz-legend-name').textContent=pt.label||`Στάση ${i+1}`;b.title=pt.label||`Στάση ${i+1}`;b.addEventListener('click',()=>openStop(pt,i));legendItems.appendChild(b);});legend.classList.toggle('show',points.length>0);}
async function draw(points){
  points.forEach((pt,i)=>{const el=document.createElement('div');el.className='hz-stop-marker';const num=document.createElement('span');num.className='hz-stop-num';num.textContent=String(i+1);const name=document.createElement('span');name.className='hz-stop-name';name.textContent=pt.label||`Στάση ${i+1}`;el.append(num,name);el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openStop(pt,i);});new maplibregl.Marker({element:el,anchor:'left',offset:[-16,0]}).setLngLat([pt.lng,pt.lat]).addTo(map);});
  buildLegend(points);let route={coords:[],routed:false,distance:null,duration:null};
  if(points.length>1){status.textContent='Υπολογισμός πραγματικής οδικής διαδρομής…';route=await roadRoute(points);map.addSource('hz-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:route.coords}}});map.addLayer({id:'hz-route-outline',type:'line',source:'hz-route',paint:{'line-color':'#ffffff','line-width':7,'line-opacity':.72}});map.addLayer({id:'hz-route',type:'line',source:'hz-route',paint:{'line-color':'#ff7a16','line-width':4,'line-opacity':.96}});}
  if(points.length){const b=new maplibregl.LngLatBounds();points.forEach(x=>b.extend([x.lng,x.lat]));map.fitBounds(b,{padding:{top:100,bottom:120,left:110,right:250},maxZoom:15,duration:900});setTimeout(()=>map.easeTo({pitch:is3d?58:0,bearing:is3d?-10:0,duration:700}),950);}
  const km=route.distance?route.distance/1000:null,mins=route.duration?Math.round(route.duration/60):null;if(route.routed)status.textContent=`${points.length} στάσεις · πραγματική οδική διαδρομή${km?` ${km.toFixed(km<10?1:0)} km`:''}${mins?` · περίπου ${mins}′ οδήγηση`:''}. Πάτησε σε στάση για πληροφορίες.`;else status.textContent=points.length>1?`${points.length} στάσεις. Ο δημόσιος router δεν απάντησε, οπότε εμφανίζεται προσωρινά απλή σύνδεση.`:`${points.length} στάση εντοπίστηκε.`;
}
map.on('load',async()=>{add3dBuildings();const labels=raw.length?raw:[destination].filter(Boolean),queries=raw.length?raw.map(x=>`${x}, ${destination}`):labels;const points=[];for(let i=0;i<queries.length;i++){status.textContent=`Εντοπισμός στάσεων ${i+1}/${queries.length}…`;try{const pt=await geocode(queries[i],labels[i]);if(pt)points.push(pt);}catch(e){console.debug(e);}if(i<queries.length-1)await sleep(1050);}if(!points.length&&destination){try{const pt=await geocode(destination,destination);if(pt)points.push(pt);}catch(e){}}await draw(points);});
document.getElementById('toggle').addEventListener('click',()=>{is3d=!is3d;map.easeTo({pitch:is3d?58:0,bearing:is3d?-10:0,duration:650});const l=map.getLayer('hz-3d-buildings');if(l)map.setLayoutProperty('hz-3d-buildings','visibility',is3d?'visible':'none');});
document.getElementById('infoClose').addEventListener('click',()=>{infoPanel.classList.remove('show');selectedStop=null;infoRequest++;});
infoFocus.addEventListener('click',()=>{if(selectedStop)map.flyTo({center:[selectedStop.lng,selectedStop.lat],zoom:17,pitch:is3d?58:0,bearing:is3d?-10:0,duration:650});});
})();
</script>
</body>
</html>
