name: Independent KINO 12-streak check

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Check all completed KINO draws since 23 Aug 2026 21:10 Athens
        run: python kino-monitor/check_alert_since_20260823.py
