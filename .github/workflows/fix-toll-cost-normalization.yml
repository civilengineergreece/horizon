name: Fix toll cost normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-toll-cost-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TollGuru cost normalization
        shell: python
        run: |
          from pathlib import Path
          p=Path('worker/src/index.js')
          s=p.read_text(encoding='utf-8')
          old="  const preferred=[costs.cash,costs.creditCard,costs.prepaidCard,costs.tag,costs.licensePlate].map(Number).filter(Number.isFinite);"
          new="  const preferred=[costs.cash,costs.creditCard,costs.prepaidCard,costs.tag,costs.licensePlate].filter(v=>v!==null&&v!==undefined&&v!==false&&v!=='').map(Number).filter(Number.isFinite);"
          if old not in s:
              raise SystemExit('routeCost block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and commit
        run: |
          node --check worker/src/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Ignore unavailable TollGuru payment methods"
          git push
