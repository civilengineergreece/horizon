name: Wire Horizon live API client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-live-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live client scripts
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="live-config.js"></script>\n<script src="live-api.js"></script>'
          if marker not in s:
              anchor='<script src="calendar-duration.js"></script>'
              if anchor not in s:
                  raise SystemExit('calendar-duration.js anchor not found')
              s=s.replace(anchor,anchor+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire Horizon live API client"
          git push
