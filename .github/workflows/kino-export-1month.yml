name: Export KINO 1-month MZI database

on:
  pull_request:
    branches: [main]
    paths:
      - 'kino-monitor/export_1month.py'
      - '.github/workflows/kino-export-1month.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Export one month of KINO MZI draws
        run: python kino-monitor/export_1month.py
      - name: Upload month files
        uses: actions/upload-artifact@v4
        with:
          name: KINO-MZI-1month-2026-07-24_to_2026-08-23
          path: kino-monitor/export_1month_output/*
          retention-days: 30
          compression-level: 6
