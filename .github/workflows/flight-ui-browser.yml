name: HORIZON frontend flight UI browser test

on:
  pull_request:
    paths:
      - 'trip-prefill-ui.js'
      - 'flights-panel.js'
      - 'tests/flight-ui-browser.mjs'
      - '.github/workflows/flight-ui-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-flight-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Serve the exact PR branch for browser testing
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/horizon-ui-server.log 2>&1 &
          sleep 2
      - name: Exercise Horizon flight UI
        run: node tests/flight-ui-browser.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-flight-ui-failure
          path: artifacts/
