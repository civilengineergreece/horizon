name: Upgrade live road roundtrip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-live-road-roundtrip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade live road UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('live-api.js')
          s=p.read_text(encoding='utf-8')
          old_road="""async function road(name){
  const s=travelState(),d=destinationByName(name),cons=Number(s.carConsumption?.value)||7.5;
  return call('/road',{origin:s.origin,destination:`${name}, ${d.country||''}`,consumptionL100:cons,fuelPriceEur:2,departureDateTime:s.dates?.from||undefined});
}
"""
          new_road="""async function road(name){
  const s=travelState(),d=destinationByName(name),cons=Number(s.carConsumption?.value)||7.5;
  const destination=`${name}, ${d.country||''}`;
  const common={consumptionL100:cons,fuelPriceEur:2,departureDateTime:s.dates?.from||undefined};
  const [outbound,inbound]=await Promise.all([
    call('/road',{origin:s.origin,destination,...common}),
    call('/road',{origin:destination,destination:s.origin,consumptionL100:cons,fuelPriceEur:2})
  ]);
  return {...outbound,returnRoutes:inbound.routes||[],returnProvider:inbound.provider||outbound.provider};
}
"""
          old_html="""function roadHtml(data){
  const r=data.routes?.[0];if(!r)return '<div class=\"hd-note\">Δεν βρέθηκε live οδική διαδρομή.</div>';
  const tollItems=(r.tolls||[]).slice(0,8).map(t=>`<div class=\"hd-item\"><span class=\"hd-num\">€</span><div><b>${esc(t.name||t.road||'Διόδιο')}</b><div class=\"hd-note\">${esc([t.road,t.country,t.type].filter(Boolean).join(' · '))}</div></div></div>`).join('');
  return `<div class=\"hd-hero\"><small>LIVE · TollGuru · μονή διαδρομή</small><strong>${Math.round(r.distanceKm)} km · ${fmtHours(r.hours)}</strong><div class=\"hd-note\">Καύσιμα ${fmtMoney(r.fuelCost)} · διόδια/οδικά τέλη ${fmtMoney(r.tollCost)} · σύνολο ${fmtMoney(r.totalRoadCost)}. Η επιστροφή μπορεί να έχει διαφορετική χρέωση.</div></div><div class=\"hd-grid\"><div class=\"hd-card\"><small>Κατανάλωση</small><b>${data.consumptionL100} L/100 km</b></div><div class=\"hd-card\"><small>Καύσιμο</small><b>${data.fuelPriceEur} €/L</b></div></div>${tollItems?`<div class=\"hd-section\"><h4>Διόδια / σημεία χρέωσης</h4><div class=\"hd-list\">${tollItems}</div></div>`:''}`;
}
"""
          new_html="""function roadHtml(data){
  const r=data.routes?.[0],back=data.returnRoutes?.[0];if(!r)return '<div class=\"hd-note\">Δεν βρέθηκε live οδική διαδρομή.</div>';
  const stationCost=t=>[t.cashCost,t.creditCardCost,t.prepaidCardCost,t.tagCost,t.licensePlateCost].find(v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v)));
  const tollRows=(route,title)=>{
    const rows=(route?.tolls||[]).slice(0,12).map(t=>{const c=stationCost(t),meta=[t.road?`Οδός ${t.road}`:'',t.country,t.type].filter(Boolean).join(' · ');return `<div class=\"hd-item\"><span class=\"hd-num\">${c!==undefined?'€':'↗'}</span><div><b>${esc(t.name||t.road||'Σημείο χρέωσης')}${c!==undefined?` · ${fmtMoney(c,t.currency||'EUR')}`:''}</b><div class=\"hd-note\">${esc(meta)}</div></div></div>`;}).join('');
    return rows?`<div class=\"hd-section\"><h4>${title}</h4><div class=\"hd-list\">${rows}</div></div>`:'';
  };
  const totalKm=r.distanceKm+(back?.distanceKm||0),totalFuel=r.fuelCost+(back?.fuelCost||0),totalTolls=r.tollCost+(back?.tollCost||0),totalCost=r.totalRoadCost+(back?.totalRoadCost||0),totalHours=r.hours+(back?.hours||0);
  return `<div class=\"hd-hero\"><small>LIVE · TollGuru · μετ’ επιστροφής</small><strong>${Math.round(totalKm)} km · ${fmtHours(totalHours)}</strong><div class=\"hd-note\">Καύσιμα ${fmtMoney(totalFuel)} · διόδια/οδικά τέλη ${fmtMoney(totalTolls)} · συνολικό οδικό κόστος ${fmtMoney(totalCost)}.</div></div><div class=\"hd-grid\"><div class=\"hd-card\"><small>Προς προορισμό</small><b>${Math.round(r.distanceKm)} km · ${fmtHours(r.hours)} · ${fmtMoney(r.totalRoadCost)}</b></div><div class=\"hd-card\"><small>Επιστροφή</small><b>${back?`${Math.round(back.distanceKm)} km · ${fmtHours(back.hours)} · ${fmtMoney(back.totalRoadCost)}`:'Δεν βρέθηκε live επιστροφή'}</b></div><div class=\"hd-card\"><small>Κατανάλωση</small><b>${data.consumptionL100} L/100 km</b></div><div class=\"hd-card\"><small>Τιμή καυσίμου</small><b>${data.fuelPriceEur} €/L</b></div></div>${tollRows(r,'Διόδια / σημεία χρέωσης προς προορισμό')}${tollRows(back,'Διόδια / σημεία χρέωσης επιστροφής')}`;
}
"""
          if old_road not in s:
              raise SystemExit('road function anchor not found')
          if old_html not in s:
              raise SystemExit('roadHtml function anchor not found')
          s=s.replace(old_road,new_road,1).replace(old_html,new_html,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          node --check live-api.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-api.js
          git diff --cached --quiet && exit 0
          git commit -m "Show live roundtrip road costs and clearer toll details"
          git push
