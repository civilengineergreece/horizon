name: HORIZON live hotel family search smoke

on:
  workflow_dispatch:
    inputs:
      authorize_billable:
        description: 'I authorize real provider quota use for this one live audit'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  production-hotel-query:
    if: inputs.authorize_billable == true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test script syntax
        run: node --check worker/tests/live-hotel-smoke.mjs
      - name: Verify Google Hotels quote and infant occupancy on production Worker
        env:
          HORIZON_ALLOW_BILLABLE: 'true'
        run: node worker/tests/live-hotel-smoke.mjs