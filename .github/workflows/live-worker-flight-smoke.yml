name: HORIZON external Worker / flights smoke test

on:
  workflow_dispatch:
    inputs:
      authorize_billable:
        description: 'I authorize real provider quota use for this one live audit'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-production-worker:
    if: inputs.authorize_billable == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate smoke-test syntax
        run: node --check worker/tests/live-worker-flight-smoke.mjs
      - name: Test deployed Worker route and live return-flight quote
        env:
          HORIZON_ALLOW_BILLABLE: 'true'
        run: node worker/tests/live-worker-flight-smoke.mjs