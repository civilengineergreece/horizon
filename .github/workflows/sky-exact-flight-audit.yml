name: Horizon SKY express exact-flight independent audit

on:
  workflow_dispatch:
    inputs:
      authorize_billable:
        description: 'I authorize real provider quota use for this one live audit'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  exact-flight-audit:
    if: inputs.authorize_billable == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check worker/tests/live-sky-pinned-audit.mjs
      - name: Audit user-confirmed SKY express itinerary against production SerpApi
        env:
          HORIZON_ALLOW_BILLABLE: 'true'
        run: node worker/tests/live-sky-pinned-audit.mjs