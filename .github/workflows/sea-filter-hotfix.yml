name: Apply sea matching hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sea-filter-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch destination sea tags and hard filter
        shell: python
        run: |
          from pathlib import Path
          p = Path('destinations-data.js')
          s = p.read_text(encoding='utf-8')

          old_tags = "const tags={city:['history','food','nightlife'],island:['sea','food','family','nature'],nature:['nature','food','family'],mixed:['sea','food','history','nature']};"
          new_tags = "const tags={city:['history','food','nightlife'],island:['sea','food','family','nature'],nature:['nature','food','family'],mixed:['food','history','nature']};\nconst seaPlaces=new Set(['Λεμεσός','Πάφος','Αττάλεια','Σαράντα','Χβαρ','Ντουμπρόβνικ','Σπλιτ','Κότορ','Μπούντβα','Μαϊάμι','Λος Άντζελες','Νίκαια','Μασσαλία','Ναύπλιο','Μονεμβασιά','Κρήτη','Μάνη','Καλαμάτα','Πάργα','Χαλκιδική','Πήλιο','Αβάνα','Κανκούν','Ντουμπάι','Άμπου Ντάμπι','Μουσκάτ','Μπαλί','Βαρκελώνη','Βαλένθια','Μάλαγα','Μαγιόρκα','Παλέρμο','Μάλτα','Αλγκάρβε','Μαδέρα','Κέιπ Τάουν','Ζανζιβάρη','Σίδνεϊ','Γκντανσκ']);"
          if old_tags not in s:
              raise SystemExit('Expected tags block not found')
          s = s.replace(old_tags, new_tags, 1)

          old_push = "out.push({name,country,region,type,tags:[...tags[type]],transport,stay,daily,travel,activity,desc:desc[type]});"
          new_push = "const placeTags=[...tags[type]].filter(t=>t!=='sea');if(type==='island'||seaPlaces.has(name))placeTags.unshift('sea');out.push({name,country,region,type,tags:placeTags,transport,stay,daily,travel,activity,desc:desc[type]});"
          if old_push not in s:
              raise SystemExit('Expected out.push block not found')
          s = s.replace(old_push, new_push, 1)

          old_score = "const r=originalScore(d),limit=parseHoursFromSpecial(),modeCompatible=state.transport==='any'||d.transport.includes(state.transport),timeCompatible=!limit||r.travelHours<=limit;\n    return {...r,hardExcluded:!modeCompatible||!timeCompatible,timeLimit:limit};"
          new_score = "const r=originalScore(d),limit=parseHoursFromSpecial(),modeCompatible=state.transport==='any'||d.transport.includes(state.transport),timeCompatible=!limit||r.travelHours<=limit,seaRequired=Array.isArray(state.interests)&&state.interests.includes('sea'),seaCompatible=!seaRequired||d.tags.includes('sea');\n    return {...r,hardExcluded:!modeCompatible||!timeCompatible||!seaCompatible,timeLimit:limit,seaRequired};"
          if old_score not in s:
              raise SystemExit('Expected score wrapper not found')
          s = s.replace(old_score, new_score, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add destinations-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix sea preference matching"
          git push
