name: HORIZON exact family flight discovery

on:
  workflow_dispatch:
    inputs:
      authorize_billable:
        description: 'I authorize real provider quota use for this one live audit'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  exact-family-discovery:
    if: inputs.authorize_billable == true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check worker/tests/live-gq-family-discovery.mjs
      - name: Verify exact GQ380 then GQ389 using real Google Flights API
        env:
          HORIZON_ALLOW_BILLABLE: 'true'
        run: node worker/tests/live-gq-family-discovery.mjs