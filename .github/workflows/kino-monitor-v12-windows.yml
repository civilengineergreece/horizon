name: Build KINO Monitor v1.2 for Windows

on:
  push:
    branches: [main]
    paths:
      - 'kino-monitor/launcher.py'
      - 'kino-monitor/app.py'
      - 'kino-monitor/requirements.txt'
      - '.github/workflows/kino-monitor-v12-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kino-monitor/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kino-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run core tests
        run: python test_logic.py

      - name: Syntax check launcher
        run: python -m py_compile launcher.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KinoMonitor-v1.2 launcher.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: KinoMonitor-v1.2-Windows
          path: kino-monitor/dist/KinoMonitor-v1.2.exe
          retention-days: 30
