name: Build KINO Monitor v1.3 for Windows

# Manual-only workflow. This prevents automatic GitHub Actions runs and
# notification emails on every push / pull request while keeping the build
# available when explicitly requested.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kino-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run core tests
        run: python test_logic.py

      - name: Syntax check launcher
        run: python -m py_compile launcher.py

      - name: Verify 12-draw alert threshold
        run: python -c "import launcher; assert launcher.core.ALERT_THRESHOLD == 11; print('OK: first alert is draw 12')"

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KinoMonitor-v1.3 launcher.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: KinoMonitor-v1.3-Windows
          path: kino-monitor/dist/KinoMonitor-v1.3.exe
          retention-days: 30
