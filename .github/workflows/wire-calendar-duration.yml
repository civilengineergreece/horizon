name: Wire calendar and duration UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-calendar-duration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add calendar-duration script to Horizon
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="calendar-duration.js"></script>'
          if marker not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing closing body tag')
              s=s.replace('</body>',marker+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use visual calendar and duration picker in Horizon"
          git push
