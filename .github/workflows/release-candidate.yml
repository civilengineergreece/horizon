name: HORIZON MVP release candidate gates

on:
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - 'tests/**'
      - 'worker/src/**'
      - 'worker/tests/**'
      - '.github/workflows/release-candidate.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - '*.js'
      - 'tests/**'
      - 'worker/src/**'
      - 'worker/tests/**'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all app/Worker/test JavaScript
        run: |
          set -e
          for f in *.js worker/src/*.js worker/tests/*.mjs tests/*.mjs; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: All isolated unit tests
        run: node --test tests/*.test.mjs worker/tests/*.test.mjs

  greek-family-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Serve exact candidate revision locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/horizon-release-server.log 2>&1 &
          sleep 2
      - name: End-to-end flight, hotel, map and desktop/mobile smoke
        env:
          HORIZON_TEST_URL: http://127.0.0.1:8765/
        run: |
          node tests/flight-ui-browser.mjs
          node tests/hotel-ui-browser.mjs
          node tests/hotel-map-browser.mjs
          node tests/hotel-map-real-leaflet-browser.mjs
          node tests/release-smoke-browser.mjs
          node tests/itinerary-pdf-browser.mjs
      - name: Screenshot on test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-release-failure
          path: artifacts/

  nonbillable-production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed Worker without spending API quota
        run: node worker/tests/production-health.mjs

  published-site-browser:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [syntax-and-unit, greek-family-browser, nonbillable-production-health]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Allow GitHub Pages latest deployment to finish
        run: sleep 65
      - name: Verify the actually published Horizon site without provider billing
        env:
          HORIZON_TEST_URL: https://civilengineergreece.github.io/horizon/
        run: |
          node tests/release-smoke-browser.mjs
          node tests/itinerary-pdf-browser.mjs
          node tests/flight-ui-browser.mjs
          node tests/hotel-ui-browser.mjs
          node tests/hotel-map-real-leaflet-browser.mjs
      - name: Screenshot on test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-published-site-failure
          path: artifacts/
