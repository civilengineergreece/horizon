name: Validate duration picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-duration-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add strict duration validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('calendar-duration.js')
          s=p.read_text(encoding='utf-8')
          old="  wrap.querySelectorAll('[data-duration]').forEach(btn=>btn.onclick=()=>update(Number(btn.dataset.duration)));\n  custom.addEventListener('input',()=>{const n=Number(custom.value);input.value=custom.value;wrap.querySelectorAll('[data-duration]').forEach(b=>b.classList.toggle('active',Number(b.dataset.duration)===n));update(n);});\n  update(Number(input.value)||0);"
          new="  wrap.querySelectorAll('[data-duration]').forEach(btn=>btn.onclick=()=>update(Number(btn.dataset.duration)));\n  custom.addEventListener('input',()=>{const n=Number(custom.value);input.value=custom.value;wrap.querySelectorAll('[data-duration]').forEach(b=>b.classList.toggle('active',Number(b.dataset.duration)===n));update(n);});\n  const nextBtn=card.querySelector('#nextBtn');\n  if(nextBtn)nextBtn.addEventListener('click',e=>{const n=Number(input.value);if(!Number.isFinite(n)||n<2||n>30){e.preventDefault();e.stopImmediatePropagation();const err=card.querySelector('#error');if(err)err.textContent='Η διάρκεια πρέπει να είναι από 2 έως 30 ημέρες.';custom.focus();}},true);\n  update(Number(input.value)||0);"
          if old not in s:
              raise SystemExit('Duration block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-duration.js
          git diff --cached --quiet && exit 0
          git commit -m "Validate Horizon trip duration strictly"
          git push
