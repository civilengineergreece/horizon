name: Export KINO 1-month MZI complete

on:
  pull_request:
    branches: [main]
    paths:
      - 'kino-monitor/export_kino_day.py'
      - 'kino-monitor/combine_kino_month.py'
      - '.github/workflows/kino-export-1month-matrix.yml'

jobs:
  fetch-day:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        date:
          - '2026-07-24'
          - '2026-07-25'
          - '2026-07-26'
          - '2026-07-27'
          - '2026-07-28'
          - '2026-07-29'
          - '2026-07-30'
          - '2026-07-31'
          - '2026-08-01'
          - '2026-08-02'
          - '2026-08-03'
          - '2026-08-04'
          - '2026-08-05'
          - '2026-08-06'
          - '2026-08-07'
          - '2026-08-08'
          - '2026-08-09'
          - '2026-08-10'
          - '2026-08-11'
          - '2026-08-12'
          - '2026-08-13'
          - '2026-08-14'
          - '2026-08-15'
          - '2026-08-16'
          - '2026-08-17'
          - '2026-08-18'
          - '2026-08-19'
          - '2026-08-20'
          - '2026-08-21'
          - '2026-08-22'
          - '2026-08-23'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --upgrade requests
      - name: Fetch all 288 KINO draws for the day
        run: python kino-monitor/export_kino_day.py "${{ matrix.date }}"
      - name: Upload validated day
        uses: actions/upload-artifact@v4
        with:
          name: kino-day-${{ matrix.date }}
          path: kino-monitor/daily_parts/${{ matrix.date }}.csv
          retention-days: 7
          compression-level: 6

  aggregate:
    needs: fetch-day
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all 31 validated daily files
        uses: actions/download-artifact@v4
        with:
          pattern: kino-day-*
          path: kino-monitor/month_parts
          merge-multiple: true
      - name: Validate and combine full month
        run: python kino-monitor/combine_kino_month.py
      - name: Upload final one-month database
        uses: actions/upload-artifact@v4
        with:
          name: KINO-MZI-complete-1month-2026-07-24_to_2026-08-23
          path: kino-monitor/export_1month_output/*
          retention-days: 30
          compression-level: 6
